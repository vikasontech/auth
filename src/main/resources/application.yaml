spring:
  application:
    name: auth

  datasource:
    url: jdbc:mysql://localhost:3306/security
    username: security
    password: security

  security:
    oauth2:
      authorizationserver:
        client:
          oidc-client:
            registration:
              client-id: "spring"
              client-secret: "{noop}spring"
              client-authentication-methods:
                - "client_secret_basic"
              authorization_grant_types:
                - "authorization_code"
#                - "client_credentials"
                - "refresh_token"
              redirect_uris:
                - "http://127.0.0.1:8082/login/oauth2/code/spring"
              scopes:
                - "openid"
                - "profile"
logging:
  level:
    org.springframework: DEBUG
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false


#https://github.com/danvega/ot/tree/master
management:
  tracing:
    sampling:
      probability: 1.0  # 100% sampling for development
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
